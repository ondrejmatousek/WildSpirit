services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wildspirit
      POSTGRES_USER: wildspirit
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=cs-CZ"
      POSTGRES_PASSWORD: "${WILDSPIRIT_DB_PASSWORD:?Set WILDSPIRIT_DB_PASSWORD before running compose}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - wildspirit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildspirit -d wildspirit"]
      interval: 10s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wildspirit;Username=wildspirit;Password=${WILDSPIRIT_DB_PASSWORD:?Set WILDSPIRIT_DB_PASSWORD before running compose}"
      FileStorage__Root: /app/App_Data/storage
    ports:
      - "5198:8080"
    volumes:
      - wildspirit-storage:/app/App_Data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  wildspirit-db:
  wildspirit-storage:
